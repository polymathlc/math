<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mathematics Sample · Polymath Learning Centre</title>
  <link rel="stylesheet" href="sample-mini.css">
  <script defer src="sample-mini.js"></script>
</head>
<body data-sample-subject="math">
  <main class="sample-shell">
    <header><span class="eyebrow">POLYMATH ONLINE · MATHEMATICS</span><h1>Try a few questions</h1><p>Explore our question practice. Write your answer, then check it for feedback.</p></header>
    <p id="sampleStatus" class="status" role="status">Loading the teacher’s sample questions…</p>
    <button id="sampleRetry" type="button" hidden>Try loading again</button>
    <nav id="sampleNav" class="question-nav" aria-label="Sample questions" hidden></nav>
    <section id="sampleQuestion" class="question-card" aria-label="Current question" hidden></section>
    <p class="sample-note">Your writing stays in this browser tab while you try the sample.</p>
  </main>
</body>
</html>
