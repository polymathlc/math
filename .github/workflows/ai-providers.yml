name: AI model and fallback checks
on:
  pull_request:
    paths: ["index.html", "game.html", "functions/**", "rapid-import/functions/**", "tools/ai-provider-tests.mjs", ".github/workflows/ai-providers.yml"]
  push:
    branches: [main]
    paths: ["index.html", "game.html", "functions/**", "rapid-import/functions/**", "tools/ai-provider-tests.mjs", ".github/workflows/ai-providers.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tools/ai-provider-tests.mjs
      - run: node --check functions/index.js
      - run: node --check rapid-import/functions/index.js
