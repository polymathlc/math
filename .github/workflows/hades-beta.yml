name: Hades Math beta checks
on:
  pull_request:
    paths: ['hades-*', 'index.html', 'tools/hades-*', '.github/workflows/hades-beta.yml']
  push:
    branches: [main]
    paths: ['hades-*', 'index.html', 'tools/hades-*', '.github/workflows/hades-beta.yml']
permissions:
  contents: read
jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test tools/hades-math-bank-tests.mjs tools/hades-learning-tests.mjs tools/hades-remote-grading-tests.mjs
      - name: Verify published game and bridge
        run: node tools/hades-artifact-check.mjs
      - name: Install isolated browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/hades-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/hades-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify question notation, bridge and beta controls
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/hades-browser/node_modules/playwright/index.mjs
          HADES_SCREENSHOTS: ${{ runner.temp }}/hades-qa
        run: |
          node tools/hades-learning-browser.mjs
          node tools/hades-math-browser-tests.mjs
          node tools/hades-display-browser.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: hades-math-beta
          path: ${{ runner.temp }}/hades-qa
          if-no-files-found: ignore
          retention-days: 7
