name: Deploy reviewed education AI backends

# Deploy only the reviewed CER and Tutor codebases using Math's existing
# credential on their shared Firebase project. Publish/run only after Math's
# Deploy Cloud Functions workflow proves this credential works. Source pins
# are fixed to reviewed merges; future Math functions changes do not trigger it.
# This workflow never deploys shared rules, creates secrets or issues IAM grant commands.
on:
  push:
    branches: ['codex/deploy-sol61-reviewed-backends-20261001']
    paths: ['.github/workflows/codex-deploy-sol61-backends.yml']

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy-education:
    if: github.repository == 'polymathlc/math' && github.ref == 'refs/heads/codex/deploy-sol61-reviewed-backends-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_PROJECT: mathgen--app
      RAPID_REGION: us-central1
      CER_SOURCE_SHA: d33c499442eaa3cb7ab5186ccfed48b2dd440ef2
      TUTOR_SOURCE_SHA: 7cef71b3109b27beaad7ed0981719f7dbbce0143
    steps:
      - name: Checkout this workflow's Math repository
        uses: actions/checkout@v4
        with:
          path: math-source
          persist-credentials: false

      - name: Checkout the reviewed CER merge
        uses: actions/checkout@v4
        with:
          repository: polymathlc/cer
          ref: d33c499442eaa3cb7ab5186ccfed48b2dd440ef2
          path: cer-source
          persist-credentials: false

      - name: Checkout the reviewed Tutor merge
        uses: actions/checkout@v4
        with:
          repository: polymathlc/tutor
          ref: 7cef71b3109b27beaad7ed0981719f7dbbce0143
          path: tutor-source
          persist-credentials: false

      - name: Verify exact sources and isolated codebases
        run: |
          set -euo pipefail
          [[ "$(git -C cer-source rev-parse HEAD)" == "$CER_SOURCE_SHA" ]]
          [[ "$(git -C tutor-source rev-parse HEAD)" == "$TUTOR_SOURCE_SHA" ]]
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path, codebase in [('cer-source/rapid-import/firebase.json', 'cer-rapid-import'), ('tutor-source/firebase.json', 'study-buddy-live')]:
              config = json.loads(Path(path).read_text())
              functions = config.get('functions')
              if not isinstance(functions, list) or len(functions) != 1 or any(key in config for key in ['firestore', 'storage']):
                  raise SystemExit('Refusing a deployment configuration outside the reviewed isolated codebases.')
              function = functions[0]
              if function.get('source') != 'functions' or function.get('codebase') != codebase or function.get('runtime') != 'nodejs22':
                  raise SystemExit('Refusing an unexpected function codebase, source or runtime.')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            cer-source/rapid-import/functions/package-lock.json
            tutor-source/functions/package-lock.json

      - name: Test both reviewed backends before deployment
        run: |
          npm ci --prefix cer-source/rapid-import/functions --no-audit --no-fund
          npm test --prefix cer-source/rapid-import/functions
          npm ci --prefix tutor-source/functions --no-audit --no-fund
          npm test --prefix tutor-source/functions
          cd tutor-source
          node --test tools/gamification-rules-tests.mjs tools/centre-admin-rules-tests.mjs

      # Same repository secret and ADC environment pattern as Math's existing
      # deploy-functions.yml, with validation and a private temporary key file.
      - name: Validate the existing Math deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync, appendFileSync} from 'node:fs';
          import {join} from 'node:path';
          const raw = process.env.FIREBASE_SERVICE_ACCOUNT;
          if (!raw) {
            console.error('::error::Math deployment credential is missing. Education backends have not been deployed.');
            process.exit(1);
          }
          let key;
          try { key = JSON.parse(raw); } catch {
            console.error('::error::Expected the existing service-account JSON credential.');
            process.exit(1);
          }
          if (key.type !== 'service_account' || key.project_id !== process.env.FIREBASE_PROJECT || !key.client_email || !key.private_key) {
            console.error('::error::Refusing a credential outside mathgen--app. Education backends have not been deployed.');
            process.exit(1);
          }
          const path = join(process.env.RUNNER_TEMP, 'education-ai-sa.json');
          writeFileSync(path, raw, {mode:0o600});
          appendFileSync(process.env.GITHUB_ENV, 'GOOGLE_APPLICATION_CREDENTIALS=' + path + '\n');
          JS

      - uses: google-github-actions/setup-gcloud@v2

      - name: Check existing deployment access without changing secrets or IAM
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --project="$FIREBASE_PROJECT" --quiet
          for secret in GEMINI_API_KEY OPENAI_API_KEY JEV_API_KEY MOONSHOT_API_KEY; do
            gcloud secrets describe "$secret" --project="$FIREBASE_PROJECT" >/dev/null
            state=$(gcloud secrets versions describe latest --secret="$secret" --project="$FIREBASE_PROJECT" --format='value(state)')
            [[ "$state" == ENABLED ]]
          done

      - name: Install the reviewed deployment CLI
        run: npm install -g firebase-tools@15.29.0 --no-audit --no-fund

      - name: Deploy only Tutor's existing codebase
        working-directory: tutor-source
        run: firebase deploy --project "$FIREBASE_PROJECT" --config firebase.json --only functions:study-buddy-live --non-interactive

      - name: Verify the already-updated CER task worker source
        run: |
          set -euo pipefail
          umask 077
          gcloud functions describe rapidImportPage --gen2 --region="$RAPID_REGION" --project="$FIREBASE_PROJECT" --format=json > "$RUNNER_TEMP/cer-worker-metadata.json"
          python3 - "$RUNNER_TEMP/cer-worker-metadata.json" "$RUNNER_TEMP/cer-worker-source-url" <<'PY'
          import json, sys
          from pathlib import Path
          worker = json.loads(Path(sys.argv[1]).read_text())
          if worker.get('name') != 'projects/mathgen--app/locations/us-central1/functions/rapidImportPage' or worker.get('state') != 'ACTIVE':
              raise SystemExit('The expected CER worker is not ACTIVE.')
          env = worker.get('serviceConfig', {}).get('environmentVariables', {})
          if env.get('RAPID_IMPORT_OPENAI_MODEL') != 'gpt-6.1-sol' or env.get('RAPID_IMPORT_KIMI_MODEL') != 'kimi-k3':
              raise SystemExit('The deployed CER model settings do not match the reviewed defaults.')
          build = worker.get('buildConfig', {})
          source = build.get('sourceProvenance', {}).get('resolvedStorageSource') or build.get('source', {}).get('storageSource', {})
          bucket, obj = source.get('bucket', ''), source.get('object', '')
          if not bucket or not obj or '\n' in bucket + obj:
              raise SystemExit('Deployed CER source archive metadata is unavailable.')
          uri = 'gs://' + bucket + '/' + obj
          generation = source.get('generation')
          if generation is not None:
              if not str(generation).isdigit():
                  raise SystemExit('Invalid source archive generation.')
              uri += '#' + str(generation)
          Path(sys.argv[2]).write_text(uri)
          print('CER task worker ACTIVE with Sol and Kimi K3 settings; updateTime=' + worker.get('updateTime', ''))
          PY
          source_uri=$(cat "$RUNNER_TEMP/cer-worker-source-url")
          gcloud storage cp "$source_uri" "$RUNNER_TEMP/cer-worker-source.zip" --quiet
          python3 - "$RUNNER_TEMP/cer-worker-source.zip" <<'PY'
          import hashlib, sys, zipfile
          expected = {'index.js': 'e8d2f3848bfb53dad9dd61624a2b32190d797330', 'ai-routing.js': '9aef561ac848d2657d18462e6b295c67c3b375ed'}
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for path, wanted in expected.items():
                  data = archive.read(path)
                  digest = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  if digest != wanted:
                      raise SystemExit('Deployed CER source differs from reviewed source: ' + path)
                  print('Exact reviewed CER source verified: ' + path + ' ' + digest)
          PY

      - name: Verify active functions and the existing task queue
        run: |
          set -euo pipefail
          for function in rapidImportStatus rapidImportBegin rapidImportChunk rapidImportFinish rapidImportRetry rapidImportDispatch rapidImportPage cerJevReview rapidVettingImage; do
            state=$(gcloud functions describe "$function" --gen2 --region="$RAPID_REGION" --project="$FIREBASE_PROJECT" --format='value(state)')
            [[ "$state" == ACTIVE ]]
          done
          for function in studyBuddyLive studyBuddyLiveCleanup studyBuddyGame studyBuddyTeach studyBuddyCentre; do
            state=$(gcloud functions describe "$function" --gen2 --region="$RAPID_REGION" --project="$FIREBASE_PROJECT" --format='value(state)')
            [[ "$state" == ACTIVE ]]
          done
          if queue_state=$(gcloud tasks queues describe rapidImportPage --location="$RAPID_REGION" --project="$FIREBASE_PROJECT" --format='value(state)' 2>/dev/null); then
            [[ "$queue_state" == RUNNING ]]
            echo 'Existing CER task queue is RUNNING.'
          else
            echo '::warning::Deployment credential cannot inspect the existing CER task queue. Worker source is verified; queue configuration was not changed.'
          fi

      - name: Check existing optional Kimi access without granting IAM
        run: |
          set -euo pipefail
          policy="$RUNNER_TEMP/cer-kimi-policy.json"
          if ! state=$(gcloud secrets versions describe latest --secret=MOONSHOT_API_KEY --project="$FIREBASE_PROJECT" --format='value(state)' 2>/dev/null) || [[ "$state" != ENABLED ]]; then
            echo '::warning::Optional Kimi secret metadata is unavailable. Its backup access was not verified; no secret or IAM changes were made.'
            exit 0
          fi
          if ! gcloud secrets get-iam-policy MOONSHOT_API_KEY --project="$FIREBASE_PROJECT" --format=json > "$policy" 2>/dev/null; then
            echo '::warning::Optional Kimi policy could not be read. Backup access was not verified; no IAM changes were made.'
            exit 0
          fi
          for function in rapidImportPage rapidVettingImage studyBuddyTeach studyBuddyGame; do
            if ! identity=$(gcloud functions describe "$function" --gen2 --region="$RAPID_REGION" --project="$FIREBASE_PROJECT" --format='value(serviceConfig.serviceAccountEmail)' 2>/dev/null) || [[ "$identity" != *@*.gserviceaccount.com ]]; then
              echo "::warning::Could not verify $function execution identity for the optional backup."
              continue
            fi
            if python3 - "$policy" "$identity" <<'PY'
          import json, sys
          with open(sys.argv[1]) as handle:
              policy = json.load(handle)
          member = 'serviceAccount:' + sys.argv[2]
          allowed = any(binding.get('role') == 'roles/secretmanager.secretAccessor' and member in binding.get('members', []) and not binding.get('condition') for binding in policy.get('bindings', []))
          sys.exit(0 if allowed else 1)
          PY
            then
              echo "$function: existing direct Kimi secret accessor binding found. No IAM changes were made."
            else
              echo "::warning::$function direct Kimi access was not confirmed. Inherited access was not checked; no IAM changes were made."
            fi
          done

      - name: Verify deployed CER authentication gate
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/cer-worker-probe.json"
          status=$(curl --silent --show-error --max-time 60 --output "$probe" --write-out '%{http_code}' --header 'Content-Type: application/json' --data '{"data":{}}' "https://$RAPID_REGION-$FIREBASE_PROJECT.cloudfunctions.net/rapidImportStatus")
          [[ "$status" == 401 ]]
          python3 - "$probe" <<'PY'
          import json, sys
          with open(sys.argv[1]) as handle:
              result = json.load(handle)
          if result.get('error', {}).get('status') != 'UNAUTHENTICATED':
              raise SystemExit('CER worker did not enforce the expected authentication gate.')
          PY

      - name: Verify Tutor text, adventure and live authentication gates
        run: |
          set -euo pipefail
          for function in studyBuddyTeach studyBuddyGame studyBuddyLive; do
            case "$function" in
              studyBuddyTeach) body='{"action":"reply","worksheetId":"deployment_probe","page":1,"message":"next hint","preparedOnly":true}' ;;
              studyBuddyGame) body='{"action":"snapshot","studentIndex":0,"subject":"math"}' ;;
              studyBuddyLive) body='{"action":"stop","sessionId":"deployment_probe"}' ;;
            esac
            probe="$RUNNER_TEMP/education-$function-probe.json"
            status=$(curl --silent --show-error --max-time 60 --output "$probe" --write-out '%{http_code}' --header 'Origin: https://polymathlc.github.io' --header 'Content-Type: application/json' --data "$body" "https://$RAPID_REGION-$FIREBASE_PROJECT.cloudfunctions.net/$function")
            [[ "$status" == 401 ]]
            python3 - "$probe" <<'PY_CHECK'
          import json, sys
          with open(sys.argv[1]) as handle:
              result = json.load(handle)
          if result.get('error', {}).get('code') != 'sign_in_required':
              raise SystemExit('Tutor did not enforce the expected sign-in requirement.')
          PY_CHECK
          done

      - name: Record completed deployment verification
        run: |
          echo "CER worker deployed from reviewed commit $CER_SOURCE_SHA and Tutor from $TUTOR_SOURCE_SHA. All fourteen functions ACTIVE, exact reviewed CER task-worker source verified, and CER/Tutor sign-in gates verified. Existing queue status is reported separately when readable. No authenticated AI call, live audio session or PDF import was submitted; end-to-end processing has not been verified. No shared rules or secret values were changed; this workflow issued no separate IAM grant commands." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary deployment files
        if: always()
        run: rm -f "$RUNNER_TEMP/education-ai-sa.json" "$RUNNER_TEMP/cer-worker-probe.json" "$RUNNER_TEMP/cer-kimi-policy.json" "$RUNNER_TEMP/education-studyBuddyTeach-probe.json" "$RUNNER_TEMP/education-studyBuddyGame-probe.json" "$RUNNER_TEMP/education-studyBuddyLive-probe.json" "$RUNNER_TEMP/cer-worker-metadata.json" "$RUNNER_TEMP/cer-worker-source-url" "$RUNNER_TEMP/cer-worker-source.zip"
