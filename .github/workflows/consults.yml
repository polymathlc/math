name: Consults

on:
  pull_request:
    paths:
      - 'consult-*.js'
      - 'consult-*.css'
      - 'index.html'
      - 'app.js'
      - 'tools/consult-bridge-tests.mjs'
      - 'tools/consult-browser-tests.mjs'
      - '.github/workflows/consults.yml'
  push:
    branches: [main]
    paths:
      - 'consult-*.js'
      - 'consult-*.css'
      - 'tools/consult-bridge-tests.mjs'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the 🙋 Consults bridge and the shared archive
        run: node --test tools/consult-bridge-tests.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/consult-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/consult-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Ask and list consults on the real page
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/consult-browser/node_modules/playwright/index.mjs
        run: node tools/consult-browser-tests.mjs
