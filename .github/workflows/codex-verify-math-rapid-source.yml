name: Verify Math rapid worker source
on:
  push:
    branches: [codex/verify-math-rapid-sol61-20261001]
    paths: [.github/workflows/codex-verify-math-rapid-source.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify credential project
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import json, os
          credential=json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])
          if credential.get('project_id') != 'mathgen--app': raise SystemExit('Unexpected credential project')
          print('Credential project verified.')
          PY
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: mathgen--app
      - name: Inspect existing deployed worker
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions describe mathRapidImportPage --gen2 --region=us-central1 --project=mathgen--app --format=json > "$RUNNER_TEMP/math-worker.json"
          python3 - "$RUNNER_TEMP/math-worker.json" "$RUNNER_TEMP/math-source-url" <<'PY'
          import json, sys
          from pathlib import Path
          worker=json.loads(Path(sys.argv[1]).read_text())
          expected='projects/mathgen--app/locations/us-central1/functions/mathRapidImportPage'
          if worker.get('name') != expected: raise SystemExit('Unexpected function')
          if worker.get('state') != 'ACTIVE': raise SystemExit('Worker is not ACTIVE')
          model=worker.get('serviceConfig',{}).get('environmentVariables',{}).get('MATH_RAPID_IMPORT_OPENAI_MODEL')
          if model != 'gpt-6.1-sol': raise SystemExit('Worker does not have the requested Sol model')
          source=worker.get('buildConfig',{}).get('source',{}).get('storageSource',{})
          bucket, obj=source.get('bucket',''),source.get('object','')
          if not bucket or not obj or '\n' in bucket+obj: raise SystemExit('Source archive metadata unavailable')
          Path(sys.argv[2]).write_text('gs://'+bucket+'/'+obj)
          print('Worker ACTIVE; model='+model+'; updateTime='+worker.get('updateTime',''))
          print('Worker build='+worker.get('buildConfig',{}).get('build',''))
          PY
          source_uri=$(cat "$RUNNER_TEMP/math-source-url")
          gcloud storage cp "$source_uri" "$RUNNER_TEMP/math-worker-source.zip" --quiet
          python3 - "$RUNNER_TEMP/math-worker-source.zip" <<'PY'
          import hashlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              if 'index.js' not in archive.namelist(): raise SystemExit('Expected source root missing')
              data=archive.read('index.js')
          digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          expected='612fd43973019f8895b7957d64a8c49e92271e70'
          if digest != expected: raise SystemExit('Deployed worker source does not match the reviewed source')
          print('Exact reviewed worker source verified: '+digest)
          PY
