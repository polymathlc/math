name: Question bank picking
on:
  pull_request:
    paths: ['index.html', 'tools/bank-pick-browser.mjs', '.github/workflows/bank-picking.yml']
  push:
    branches: [main]
    paths: ['index.html', 'tools/bank-pick-browser.mjs', '.github/workflows/bank-picking.yml']
permissions:
  contents: read
jobs:
  picking:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --prefix /tmp/pick-browser --no-audit --no-fund playwright@1.62.1
          /tmp/pick-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Tick, search, filter, then build a practice and a worksheet
        env:
          PLAYWRIGHT_MODULE: /tmp/pick-browser/node_modules/playwright/index.mjs
        run: node tools/bank-pick-browser.mjs /tmp/pick-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bank-picking
          path: /tmp/pick-qa
