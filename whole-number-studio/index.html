<!doctype html><html lang="en-SG"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whole Number Studio · Polymath</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ec;color:#163d37;font:16px/1.5 "Trebuchet MS",Arial,sans-serif}main{max-width:940px;margin:auto;padding:28px 20px 60px}header,nav,.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{justify-content:space-between;border-bottom:1px solid #b9c6bc;padding-bottom:15px}small,header span{letter-spacing:.1em;text-transform:uppercase;font-size:12px}h1,h2,.display{font-family:Georgia,serif;line-height:1.12}h1{font-size:clamp(40px,7vw,74px);margin:30px 0 18px}h2{font-size:30px;margin:10px 0}button,select,input{font:inherit;border:1px solid #92a69c;border-radius:8px;padding:9px 13px;background:white;color:inherit}button,select{cursor:pointer}button:hover{border-color:#155b4d}button[aria-pressed=true],.check{background:#184c41;color:white}nav{margin-bottom:18px}.lab{background:#153e38;color:#fff;padding:clamp(18px,4vw,36px);border-radius:18px}.display{font-size:clamp(27px,5vw,52px);margin:15px 0;color:#f4db98;overflow-wrap:anywhere}.lab select,.lab button{color:#163d37}.lab p{max-width:65ch}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid #d2d9d0;padding:18px;border-radius:12px}.card label{display:block;min-height:3em;margin:8px 0}.card input{width:100%;margin-bottom:8px}.feedback{display:block;margin-top:8px}.practice{margin:28px 0 14px;display:flex;align-items:center;justify-content:space-between}.paper{display:none}@media(max-width:600px){.cards{grid-template-columns:1fr}main{padding:16px 12px}nav button{flex:1;font-size:14px}}
@page{size:A4 portrait;margin:15mm}@media print{body{background:white;color:#172d28;font:11pt/1.45 Arial}main{display:none}.paper{display:block}.sheet{break-after:page}.sheet:last-child{break-after:auto}.sheet h1{font-size:32pt;margin:8mm 0 3mm}.example{border:1px solid #748d80;padding:4mm}.item{break-inside:avoid;margin:5mm 0}.rule{height:9mm;border-bottom:1px solid #aab5ad}.sheet header{font-size:10pt}}
</style>
<main><header><span>Polymath Learning Centre</span><button onclick="window.print()">Print A4 worksheet</button></header><h1>Whole Number Studio</h1><nav aria-label="Topics"></nav><section class="lab"><small>Worked example</small><h2 id="title"></h2><div class="tools" id="controls"></div><div class="display" id="display" aria-live="polite"></div><p id="explain"></p></section><div class="practice"><h2>Try it yourself</h2><output id="score"></output></div><section class="cards"></section></main><div class="paper"></div>
<script>
const topics=['Place value','Scaling numbers','Order of operations'];
const questions=[
[['Write 6,040,012 in words.','six million forty thousand and twelve','Read each group of three digits, starting with the millions.'],['Write nine million, five thousand and eight in figures.','9005008','Use three digits for each group after the millions.'],['Fill in <, > or = between 4,091,005 and 4,109,005.','<','Compare the hundred thousands digits after the equal millions.'],['Round 3,649,501 to the nearest thousand.','3650000','The last three digits are 501, so round up.'],['Round 9,950,000 to the nearest hundred thousand.','10000000','The ten thousands digit is 5. Round up and regroup.'],['What is the value of the digit 7 in 5,072,406?','70000','The 7 is in the ten thousands place.']],
[['48 × 10','480','Each digit moves one place left.'],['37 × 100','3700','Each digit moves two places left.'],['26 × 1,000','26000','Each digit moves three places left.'],['8,400 ÷ 100','84','Each digit moves two places right.'],['24 × 300','7200','Multiply by 3, then by 100.'],['360,000 ÷ 4,000','90','Divide by 1,000, then by 4.']],
[['18 + 6 × 4','42','Multiply 6 by 4 first.'],['(18 + 6) × 4','96','Add inside the brackets first.'],['72 ÷ 8 × 3','27','Division and multiplication have equal priority. Work from left to right.'],['50 − 18 + 6','38','Addition and subtraction have equal priority. Work from left to right.'],['60 − (16 + 8) ÷ 4','54','Add inside the brackets, then divide before subtracting.'],['84 ÷ (9 − 2) + 3 × 5','27','Evaluate the brackets, then divide and multiply before adding.']]
];
const summaries=['Read the digits in groups of three. Compare from the left. To round, look one place to the right of the rounding place. Round up for 5 to 9.','Split a multiple into factors. For example, 36 × 200 = 36 × 2 × 100 = 7,200. Reverse the steps to divide.','Work inside brackets first. Then multiply or divide from left to right. Finally add or subtract from left to right. Show your working without a calculator.'];
const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString('en-SG');
let topic=0;
const saved=questions.map(group=>group.map(()=>({value:'',message:'',ok:false})));
function lab(){
 const controls=$('#controls'),display=$('#display'),explain=$('#explain');
 controls.replaceChildren();$('#title').textContent=['Explore the digits','Build a scale factor','Follow the calculation'][topic];
 function choice(label,options){const select=document.createElement('select');select.setAttribute('aria-label',label);options.forEach(x=>select.add(new Option(x)));controls.append(select);return select}
 if(topic===0){const digits='7084306',names=['millions','hundred thousands','ten thousands','thousands','hundreds','tens','ones'];const place=choice('Choose a place',names);function show(){const i=place.selectedIndex;display.textContent=fmt(+digits);explain.textContent='The '+names[i]+' digit is '+digits[i]+'. Its value is '+fmt(+digits[i]*10**(6-i))+'.'}place.onchange=show;show()}
 if(topic===1){const op=choice('Operation',['Multiply','Divide']),factor=choice('Factor',[10,100,1000,30,400,2000]);function show(){const f=+factor.value,m=op.selectedIndex===0,n=m?36:36*f,base=10**Math.floor(Math.log10(f)),k=f/base;display.textContent=fmt(n)+(m?' × ':' ÷ ')+fmt(f)+' = '+fmt(m?n*f:36);explain.textContent=k===1?'Each digit moves '+Math.log10(base)+(base===10?' place':' places')+' to the '+(m?'left.':'right.'):(m?'Multiply by '+k+' to get '+fmt(n*k)+', then multiply by '+fmt(base):'Divide by '+fmt(base)+' to get '+fmt(n/base)+', then divide by '+k)+'.'}op.onchange=factor.onchange=show;show()}
 if(topic===2){const steps=['48 − (6 + 2) × 3','48 − 8 × 3','48 − 24','24'],notes=['Which operation comes first?','6 + 2 = 8. Now multiply before subtracting.','8 × 3 = 24. Now subtract.','48 − 24 = 24.'];let i=0;const b=document.createElement('button');controls.append(b);function show(){display.textContent=steps[i];explain.textContent=notes[i];b.textContent=i===3?'Start again':'Show next step'}b.onclick=()=>{i=(i+1)%4;show()};show()}
}
function norm(s){return s.toLowerCase().replace(/[,\-]/g,' ').trim().replace(/\s+/g,' ')}
function mark(value,answer){if(/^\d+$/.test(answer))return /^(?:\d+|\d{1,3}(?:,\d{3})+)$/.test(value.trim())&&Number(value.replaceAll(',',''))===Number(answer);return norm(value)===norm(answer)}
function score(){$('#score').textContent=saved[topic].filter(x=>x.ok).length+' / 6 correct'}
function render(){document.querySelectorAll('nav button').forEach((b,i)=>b.setAttribute('aria-pressed',i===topic));lab();const cards=$('.cards');cards.replaceChildren();questions[topic].forEach(([prompt,answer,hint],i)=>{const state=saved[topic][i],form=document.createElement('form');form.className='card';form.innerHTML='<small>Practice '+(i+1)+'</small><label for="answer'+i+'"></label><input autocomplete="off" id="answer'+i+'"><button class="check">Check answer</button><span class="feedback" role="status"></span>';const input=form.querySelector('input'),feedback=form.querySelector('span');form.querySelector('label').textContent=prompt;input.value=state.value;feedback.textContent=state.message;input.oninput=()=>{state.value=input.value;state.ok=false;feedback.textContent=state.message='';score()};form.onsubmit=e=>{e.preventDefault();state.ok=mark(input.value,answer);feedback.textContent=state.message=state.ok?'Correct. '+hint:'Try again. '+hint;score()};cards.append(form)});score()}
topics.forEach((name,t)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>{topic=t;render()};$('nav').append(b);const sheet=document.createElement('section');sheet.className='sheet';sheet.innerHTML='<header>Polymath Learning Centre <span>Whole Number Studio · '+(t+1)+'/3</span></header><h1>'+name+'</h1><p>Name _________________________　 Date ______________</p><p class="example">'+summaries[t]+'</p>';questions[t].forEach(([prompt],i)=>{const item=document.createElement('div');item.className='item';item.textContent=(i+1)+'. '+prompt;item.insertAdjacentHTML('beforeend','<div class="rule"></div><div class="rule"></div>');sheet.append(item)});$('.paper').append(sheet)});render();
</script></html>
